# 테스트 서버(3.35.86.137) 전용 프로필.
# docker-compose.test-server.yml 로 함께 뜨는 postgres 컨테이너를 사용한다.
# 여기에는 application.yml 과 달라지는 값만 둔다. 나머지는 전부 상속받는다.
spring:
  datasource:
    url: ${DB_URL_KIRYONG}          # 예: jdbc:postgresql://postgres:5432/kibab
    username: ${DB_USERNAME_KIRYONG}
    password: ${DB_PASSWORD_KIRYONG}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: true
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: warn
    com.kyonggi.diet: debug

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always
